name: Build Breezy Blush APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract app source
        run: |
          unzip -q Breezy_Blush_GitHub_Build_Pack.zip -d /tmp/breezy-pack
          cp -R /tmp/breezy-pack/breezy_blush_github/. .

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project
        run: flutter create --platforms=android --project-name breezy_blush .

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: breezy-blush-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
